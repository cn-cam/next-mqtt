name: docker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'deploy/docker/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-main
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push edge image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        id: dockerhub
        if: ${{ env.DOCKERHUB_ENABLED == 'true' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Metadata (GHCR only)
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-,format=short
      - name: Metadata (GHCR and Docker Hub)
        id: meta-both
        if: ${{ steps.dockerhub.outcome == 'success' }}
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/next-mqtt
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-,format=short
      - name: Select image metadata
        id: meta
        env:
          DOCKERHUB_READY: ${{ steps.dockerhub.outcome == 'success' }}
          GHCR_TAGS: ${{ steps.meta-ghcr.outputs.tags }}
          GHCR_LABELS: ${{ steps.meta-ghcr.outputs.labels }}
          BOTH_TAGS: ${{ steps.meta-both.outputs.tags }}
          BOTH_LABELS: ${{ steps.meta-both.outputs.labels }}
        run: |
          if [ "$DOCKERHUB_READY" = "true" ]; then
            tags="$BOTH_TAGS"
            labels="$BOTH_LABELS"
          else
            echo "Docker Hub is not configured or the login failed; publishing to GHCR only."
            tags="$GHCR_TAGS"
            labels="$GHCR_LABELS"
          fi
          {
            echo 'tags<<EOF'
            echo "$tags"
            echo 'EOF'
            echo 'labels<<EOF'
            echo "$labels"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
