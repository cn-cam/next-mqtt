name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    name: Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for forbidden brand tokens
        run: bash scripts/compliance-check.sh
      - name: Reject committed secrets
        run: |
          if git grep -I -n -E '(ghp_[A-Za-z0-9]{30,}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)' -- .; then
            echo "Potential secret material found."
            exit 1
          fi

  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore NextMqtt.slnx
      - name: Build
        run: dotnet build NextMqtt.slnx -c Release --no-restore
      - name: Test
        run: dotnet test NextMqtt.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName
            $failed += $trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed'
          }
          if ($failed.Count -eq 0) {
            Write-Host '::error::Test step failed but no failed test was found in the TRX files'
            exit 0
          }
          foreach ($test in $failed) {
            $message = $test.output.ErrorInfo.Message
            Write-Host "::error::Failed test: $($test.testName)"
            "- **$($test.testName)**: $message" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: web/dist

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build site
        run: npm run build
        env:
          DOCS_BASE: /next-mqtt/
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/.vitepress/dist

  helm:
    name: Kubernetes manifests and Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - run: helm lint deploy/helm/next-mqtt
      - run: helm template nextmqtt deploy/helm/next-mqtt --namespace nextmqtt > /tmp/rendered.yaml
      - run: kubectl kustomize deploy/kubernetes > /tmp/kustomized.yaml
      - name: Check rendered resources
        run: |
          grep -q "kind: StatefulSet" /tmp/rendered.yaml
          grep -q "kind: StatefulSet" /tmp/kustomized.yaml

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: nextmqtt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run -d --name nextmqtt-ci -p 1883:1883 -p 8080:8080 \
            -e NEXTMQTT_ADMIN_PASSWORD=ci-password nextmqtt:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/healthz
          curl -fsS -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-password"}' | grep -q '"token"'
          docker rm -f nextmqtt-ci
