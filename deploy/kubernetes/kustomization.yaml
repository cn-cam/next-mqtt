apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nextmqtt

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - serviceaccount.yaml
  - service-headless.yaml
  - service.yaml
  - statefulset.yaml
  - ingress.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: nextmqtt

images:
  - name: ghcr.io/cn-cam/next-mqtt
    newTag: 0.6.0
