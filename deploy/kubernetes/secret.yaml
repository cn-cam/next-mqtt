apiVersion: v1
kind: Secret
metadata:
  name: nextmqtt-secrets
  labels:
    app.kubernetes.io/name: nextmqtt
    app.kubernetes.io/component: broker
type: Opaque
stringData:
  # Replace every value before applying. The cluster secret must be 16+
  # characters and identical on all nodes.
  admin-password: "change-me-before-deploy"
  token-secret: "replace-with-a-long-random-token-secret"
  cluster-secret: "replace-with-a-shared-cluster-secret"
