apiVersion: v1
kind: Service
metadata:
  name: nextmqtt-headless
  labels:
    app.kubernetes.io/name: nextmqtt
    app.kubernetes.io/component: cluster
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: nextmqtt
    app.kubernetes.io/component: broker
  ports:
    - name: cluster
      port: 8080
      targetPort: http
    - name: mqtt
      port: 1883
      targetPort: mqtt
