apiVersion: v1
kind: ConfigMap
metadata:
  name: nextmqtt-config
  labels:
    app.kubernetes.io/name: nextmqtt
    app.kubernetes.io/component: broker
data:
  # Development-friendly defaults. Disable anonymous access and deny by
  # default before exposing the broker to untrusted networks.
  NEXTMQTT_ALLOW_ANONYMOUS: "true"
  NEXTMQTT_ACL__DEFAULTPOLICY: "Allow"

  NEXTMQTT_SERVER__TCP__HOST: "0.0.0.0"
  NEXTMQTT_SERVER__TCP__PORT: "1883"
  NEXTMQTT_SERVER__HTTP__PORT: "8080"
  NEXTMQTT_SERVER__HTTP__WEBSOCKETPORT: "8083"

  NEXTMQTT_BROKER__MAXPACKETSIZE: "1048576"
  NEXTMQTT_BROKER__MAXINFLIGHTMESSAGES: "32"
  NEXTMQTT_BROKER__MAXQUEUEDMESSAGES: "1000"
  NEXTMQTT_BROKER__MAXSUBSCRIPTIONSPERSESSION: "1000"
  NEXTMQTT_BROKER__MAXTOPICALIAS: "32"

  NEXTMQTT_CLUSTER__ENABLED: "true"
  NEXTMQTT_CLUSTER__HEARTBEATSECONDS: "2"
  NEXTMQTT_CLUSTER__NODETIMEOUTSECONDS: "15"
  NEXTMQTT_CLUSTER__REQUESTTIMEOUTSECONDS: "5"
