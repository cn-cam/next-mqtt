apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nextmqtt
  labels:
    app.kubernetes.io/name: nextmqtt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: nextmqtt
  minReplicas: 3
  maxReplicas: 9
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
