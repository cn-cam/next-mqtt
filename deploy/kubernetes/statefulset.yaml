apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextmqtt
  labels:
    app.kubernetes.io/name: nextmqtt
    app.kubernetes.io/component: broker
spec:
  serviceName: nextmqtt-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: nextmqtt
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextmqtt
        app.kubernetes.io/component: broker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: nextmqtt
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nextmqtt
                    app.kubernetes.io/component: broker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: broker
          image: ghcr.io/cn-cam/next-mqtt:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt
              containerPort: 1883
            - name: mqtts
              containerPort: 8883
            - name: http
              containerPort: 8080
            - name: ws
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: nextmqtt-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: /tmp
            - name: NEXTMQTT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextmqtt-secrets
                  key: admin-password
            - name: NEXTMQTT_ADMIN_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextmqtt-secrets
                  key: token-secret
            - name: NEXTMQTT_CLUSTER__SECRET
              valueFrom:
                secretKeyRef:
                  name: nextmqtt-secrets
                  key: cluster-secret
            - name: NEXTMQTT_CLUSTER__NODEID
              value: $(POD_NAME)
            - name: NEXTMQTT_CLUSTER__ADVERTISEURL
              value: http://$(POD_NAME).nextmqtt-headless.$(POD_NAMESPACE).svc.cluster.local:8080
            - name: NEXTMQTT_CLUSTER__SEEDS__0
              value: http://nextmqtt-0.nextmqtt-headless.$(POD_NAMESPACE).svc.cluster.local:8080
            - name: NEXTMQTT_CLUSTER__SEEDS__1
              value: http://nextmqtt-1.nextmqtt-headless.$(POD_NAMESPACE).svc.cluster.local:8080
            - name: NEXTMQTT_CLUSTER__SEEDS__2
              value: http://nextmqtt-2.nextmqtt-headless.$(POD_NAMESPACE).svc.cluster.local:8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
