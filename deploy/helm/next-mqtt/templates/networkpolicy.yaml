{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nextmqtt.fullname" . }}
  labels:
    {{- include "nextmqtt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nextmqtt.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.mqtt.port }}
          protocol: TCP
        - port: {{ .Values.mqtt.tlsPort }}
          protocol: TCP
        - port: {{ .Values.http.port }}
          protocol: TCP
        - port: {{ .Values.http.wsPort }}
          protocol: TCP
{{- end }}
