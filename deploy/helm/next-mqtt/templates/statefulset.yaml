apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nextmqtt.fullname" . }}
  labels:
    {{- include "nextmqtt.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "nextmqtt.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "nextmqtt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nextmqtt.selectorLabels" . | nindent 8 }}
        {{- include "nextmqtt.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.http.port | quote }}
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "nextmqtt.fullname" . }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.podAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "nextmqtt.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: broker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: mqtt
              containerPort: {{ .Values.mqtt.port }}
            - name: mqtts
              containerPort: {{ .Values.mqtt.tlsPort }}
            - name: http
              containerPort: {{ .Values.http.port }}
            - name: ws
              containerPort: {{ .Values.http.wsPort }}
          envFrom:
            - configMapRef:
                name: {{ include "nextmqtt.fullname" . }}-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: /tmp
            - name: NEXTMQTT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextmqtt.secretName" . }}
                  key: admin-password
            - name: NEXTMQTT_ADMIN_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextmqtt.secretName" . }}
                  key: token-secret
            - name: NEXTMQTT_CLUSTER__SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextmqtt.secretName" . }}
                  key: cluster-secret
            - name: NEXTMQTT_CLUSTER__NODEID
              value: $(POD_NAME)
            - name: NEXTMQTT_CLUSTER__ADVERTISEURL
              value: http://$(POD_NAME).{{ include "nextmqtt.fullname" . }}-headless.$(POD_NAMESPACE).svc.cluster.local:{{ .Values.http.port }}
            {{- if .Values.cluster.enabled }}
            {{- range $i := until (int .Values.replicaCount) }}
            - name: NEXTMQTT_CLUSTER__SEEDS__{{ $i }}
              value: http://{{ include "nextmqtt.fullname" $ }}-{{ $i }}.{{ include "nextmqtt.fullname" $ }}-headless.$(POD_NAMESPACE).svc.cluster.local:{{ $.Values.http.port }}
            {{- end }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
