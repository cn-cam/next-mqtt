{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nextmqtt.fullname" . }}-secrets
  labels:
    {{- include "nextmqtt.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.admin.password | quote }}
  token-secret: {{ .Values.admin.tokenSecret | quote }}
  cluster-secret: {{ .Values.cluster.secret | quote }}
{{- end }}
