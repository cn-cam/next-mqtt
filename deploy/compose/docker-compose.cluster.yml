name: nextmqtt-cluster

x-node: &node
  image: ghcr.io/cn-cam/next-mqtt:${NEXTMQTT_VERSION:-latest}
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  restart: unless-stopped
  environment: &node-env
    NEXTMQTT_ADMIN_PASSWORD: ${NEXTMQTT_ADMIN_PASSWORD:-change-me-now}
    # Set one value for all nodes so a dashboard token is accepted cluster-wide;
    # left empty each node signs tokens with its own ephemeral key.
    NEXTMQTT_ADMIN_TOKEN_SECRET: ${NEXTMQTT_ADMIN_TOKEN_SECRET:-}
    NEXTMQTT_ALLOW_ANONYMOUS: ${NEXTMQTT_ALLOW_ANONYMOUS:-true}
    NEXTMQTT_CLUSTER__ENABLED: "true"
    NEXTMQTT_CLUSTER__SECRET: ${NEXTMQTT_CLUSTER_SECRET:-change-me-cluster-secret}
    NEXTMQTT_CLUSTER__HEARTBEATSECONDS: "2"
    NEXTMQTT_CLUSTER__NODETIMEOUTSECONDS: "15"
    # "file" journals retained messages under /app/data so they survive restarts.
    NEXTMQTT_STORAGE__RETAINED__MODE: ${NEXTMQTT_RETAINED_MODE:-memory}
    NEXTMQTT_STORAGE__RETAINED__PATH: /app/data/retained.log
    NEXTMQTT_STORAGE__SESSION__MODE: ${NEXTMQTT_SESSION_MODE:-memory}
    NEXTMQTT_STORAGE__SESSION__PATH: /app/data/sessions.json
    # Integration bridges; disabled unless the matching .env values are set.
    NEXTMQTT_INTEGRATIONS__KAFKA__ENABLED: ${NEXTMQTT_KAFKA_ENABLED:-false}
    NEXTMQTT_INTEGRATIONS__KAFKA__BOOTSTRAPSERVERS: ${NEXTMQTT_KAFKA_BOOTSTRAP:-127.0.0.1:9092}
    NEXTMQTT_INTEGRATIONS__KAFKA__TOPICPREFIX: ${NEXTMQTT_KAFKA_PREFIX:-mqtt.}
    NEXTMQTT_INTEGRATIONS__KAFKA__FILTER: ${NEXTMQTT_KAFKA_FILTER:-#}
    NEXTMQTT_INTEGRATIONS__RABBIT__ENABLED: ${NEXTMQTT_RABBIT_ENABLED:-false}
    NEXTMQTT_INTEGRATIONS__RABBIT__HOSTNAME: ${NEXTMQTT_RABBIT_HOST:-127.0.0.1}
    NEXTMQTT_INTEGRATIONS__RABBIT__PORT: ${NEXTMQTT_RABBIT_PORT:-5672}
    NEXTMQTT_INTEGRATIONS__RABBIT__USERNAME: ${NEXTMQTT_RABBIT_USER:-guest}
    NEXTMQTT_INTEGRATIONS__RABBIT__PASSWORD: ${NEXTMQTT_RABBIT_PASSWORD:-guest}
    NEXTMQTT_INTEGRATIONS__RABBIT__EXCHANGE: ${NEXTMQTT_RABBIT_EXCHANGE:-nextmqtt}
    NEXTMQTT_INTEGRATIONS__RABBIT__FILTER: ${NEXTMQTT_RABBIT_FILTER:-#}
    # TLS; mount a certificate directory at /certs and set the paths below.
    NEXTMQTT_SERVER__TLS__ENABLED: ${NEXTMQTT_TLS_ENABLED:-false}
    NEXTMQTT_SERVER__TLS__CERTIFICATEPATH: ${NEXTMQTT_TLS_CERT:-/certs/server.pem}
    NEXTMQTT_SERVER__TLS__CERTIFICATEKEYPATH: ${NEXTMQTT_TLS_KEY:-/certs/server.key}
    NEXTMQTT_SERVER__TLS__DOMAIN: ${NEXTMQTT_TLS_DOMAIN:-}
    NEXTMQTT_SERVER__HTTP__TLSPORT: ${NEXTMQTT_HTTPS_PORT:-8084}
    NEXTMQTT_SERVER__HTTP__CERTIFICATEPATH: ${NEXTMQTT_HTTPS_CERT:-}
    NEXTMQTT_SERVER__HTTP__CERTIFICATEKEYPATH: ${NEXTMQTT_HTTPS_KEY:-}
    NEXTMQTT_SERVER__HTTP__DOMAIN: ${NEXTMQTT_HTTPS_DOMAIN:-}
  # Optional alias so a broker on the host (for example a local Kafka that
  # advertises kafka.local) is reachable from the containers.
  extra_hosts:
    - "${NEXTMQTT_HOST_ALIAS:-host.docker.internal:host-gateway}"
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
    interval: 15s
    timeout: 5s
    retries: 5

services:
  node-a:
    <<: *node
    container_name: nextmqtt-node-a
    volumes:
      - node-a-data:/app/data
      - ${NEXTMQTT_CERT_DIR:-./certs}:/certs:ro
    ports:
      - "1883:1883"
      - "8080:8080"
      - "8083:8083"
      - "8086:8084"
      - "8883:8883"
    environment:
      <<: *node-env
      NEXTMQTT_CLUSTER__NODEID: node-a
      NEXTMQTT_CLUSTER__ADVERTISEURL: http://node-a:8080
      NEXTMQTT_CLUSTER__SEEDS__0: http://node-b:8080
      NEXTMQTT_CLUSTER__SEEDS__1: http://node-c:8080

  node-b:
    <<: *node
    container_name: nextmqtt-node-b
    volumes:
      - node-b-data:/app/data
      - ${NEXTMQTT_CERT_DIR:-./certs}:/certs:ro
    ports:
      - "1884:1883"
      - "8081:8080"
      - "8084:8083"
      - "8087:8084"
      - "8884:8883"
    environment:
      <<: *node-env
      NEXTMQTT_CLUSTER__NODEID: node-b
      NEXTMQTT_CLUSTER__ADVERTISEURL: http://node-b:8080
      NEXTMQTT_CLUSTER__SEEDS__0: http://node-a:8080
      NEXTMQTT_CLUSTER__SEEDS__1: http://node-c:8080

  node-c:
    <<: *node
    container_name: nextmqtt-node-c
    volumes:
      - node-c-data:/app/data
      - ${NEXTMQTT_CERT_DIR:-./certs}:/certs:ro
    ports:
      - "1885:1883"
      - "8082:8080"
      - "8085:8083"
      - "8088:8084"
      - "8885:8883"
    environment:
      <<: *node-env
      NEXTMQTT_CLUSTER__NODEID: node-c
      NEXTMQTT_CLUSTER__ADVERTISEURL: http://node-c:8080
      NEXTMQTT_CLUSTER__SEEDS__0: http://node-a:8080
      NEXTMQTT_CLUSTER__SEEDS__1: http://node-b:8080

volumes:
  node-a-data:
  node-b-data:
  node-c-data:
