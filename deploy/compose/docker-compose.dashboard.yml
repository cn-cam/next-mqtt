# Optional single dashboard entry point for the three-node cluster.
#
#   docker compose -f docker-compose.cluster.yml \
#                  -f docker-compose.dashboard.yml up -d
#
# The nginx service terminates TLS once and forwards to node-a/b/c. ip_hash keeps
# a browser on one node, so the dashboard token; set the same
# NEXTMQTT_ADMIN_TOKEN_SECRET on every node if you replace ip_hash with round
# robin or use an external load balancer without sticky sessions.
services:
  dashboard:
    image: nginx:1.27-alpine
    container_name: nextmqtt-dashboard
    restart: unless-stopped
    ports:
      - "${NEXTMQTT_DASHBOARD_PORT:-8443}:8443"
    environment:
      NEXTMQTT_DASHBOARD_CERT: ${NEXTMQTT_HTTPS_CERT:-/certs/server.pem}
      NEXTMQTT_DASHBOARD_KEY: ${NEXTMQTT_HTTPS_KEY:-/certs/server.key}
    volumes:
      - ${NEXTMQTT_CERT_DIR:-./certs}:/certs:ro
      - ./nginx:/etc/nginx/templates:ro
    depends_on:
      - node-a
      - node-b
      - node-c
